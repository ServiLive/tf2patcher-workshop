name: Build
on:
  push:
    branches: ["current"]
  pull_request:
    branches: ["current"]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Type of build'
        required: true
        default: 'Release'
        type: choice
        options:
          - Release
          - Debug
jobs:
  build-linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    env:
      APPIMAGE_EXTRACT_AND_RUN: 1
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
      LINUXDEPLOY_VERSION: 1-alpha-20251107-1
    steps:
      - uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2

      - name: Cache LinuxDeploy
        uses: actions/cache@v4
        with:
          path: linuxdeploy-x86_64.AppImage
          key: linuxdeploy-${{ env.LINUXDEPLOY_VERSION }}

      - name: Download LinuxDeploy
        run: |
          if [ ! -f linuxdeploy-x86_64.AppImage ]; then
            wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/${{ env.LINUXDEPLOY_VERSION }}/linuxdeploy-x86_64.AppImage
          fi
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Build
        run: make TARGET=64 MODE=${{ env.BUILD_TYPE }}

      - name: Create AppImage
        run: |
          export ARCH=x86_64
          if [ -f tf2patcher.svg ]; then
            ICON_FILE="tf2patcher.svg"
          else
            ICON_FILE="tf2patcher.png"
          fi

          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            -e bin/tf2patcher \
            -i "$ICON_FILE" \
            -d tf2patcher.desktop \
            --output appimage
          mv tf2patcher-*.AppImage tf2patcher.AppImage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2patcher-linux64
          path: |
            tf2patcher.AppImage
            bin/tf2patcher

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      - name: Build
        run: make TARGET=64 MODE=${{ env.BUILD_TYPE }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tf2patcher-win64
          path: bin/tf2patcher.exe

  release:
    needs: [build-linux, build-windows]
    if: >
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/current'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      BUILD_TYPE: ${{ inputs.build_type || 'Release' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set build metadata
        id: meta
        run: |
          echo "timestamp=$(git log -1 --format=%cI)" >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release files
        run: |
          mkdir -p release
          cp dist/tf2patcher-linux64/tf2patcher.AppImage release/tf2patcher.AppImage
          cp dist/tf2patcher-linux64/bin/tf2patcher release/tf2patcher
          cp dist/tf2patcher-win64/tf2patcher.exe release/tf2patcher.exe

      - name: Continuous Release
        uses: softprops/action-gh-release@4dd30955cca228da305ffee6fbc3fc1f95d447c2
        with:
          tag_name: continuous
          name: "Latest Continuous Build"
          body: |
            Automated build from branch `current`.
            Build type: ${{ env.BUILD_TYPE }}
            Commit: ${{ github.sha }}
            Built: ${{ steps.meta.outputs.timestamp }}
          prerelease: true
          files: |
            release/tf2patcher.AppImage
            release/tf2patcher
            release/tf2patcher.exe
